kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g
# JVM toolchain for COMPILING project sources is pinned in the root
# build.gradle.kts (kotlin { jvmToolchain(21) }) — separate concern.
#
# org.gradle.java.home below controls which JDK runs the GRADLE DAEMON
# itself (parses .gradle.kts files, etc). Very new JDKs with unusual
# version-string formats (observed: JDK 25.0.4.1 on Ubuntu 26.04) can
# crash Gradle's embedded Kotlin DSL script compiler with
# "java.lang.IllegalArgumentException: <version>" during settings
# evaluation — this is a Gradle/Kotlin-DSL parser limitation, not a
# project bug. Fix: install a widely-supported LTS JDK (21) alongside
# your system default and point Gradle at it here. Uncomment and set
# the correct path for your machine:
# org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
