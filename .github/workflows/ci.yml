name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Test release evidence collector
        run: node --test scripts/release-evidence.test.mjs
      - name: Build, lint, and test
        run: ./gradlew build --continue --console=plain
      - name: CLI status and shutdown smoke test
        run: python3 scripts/p09-cli-status-smoke.py
      - name: Signed P10 CLI smoke test
        run: python3 scripts/p10-signed-cli-smoke.py
      - name: P01 credential lifecycle CLI smoke test
        run: python3 scripts/p01-credential-cli-smoke.py
      - name: Research CLI local workflow smoke test
        run: python3 scripts/research-cli-smoke.py
      - name: Two-node Core Loop and signed exit rehearsal
        run: ./scripts/two-node-core-loop.sh
      - name: Collect release evidence
        run: node scripts/release-evidence.mjs
      - name: Retain verified distributions and reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: release-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release-evidence/
          if-no-files-found: error
          retention-days: 30
