name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build, lint, and test
        run: ./gradlew build --continue --console=plain
      - name: CLI status and shutdown smoke test
        run: python3 scripts/p09-cli-status-smoke.py
      - name: Signed P10 CLI smoke test
        run: python3 scripts/p10-signed-cli-smoke.py
      - name: P01 credential lifecycle CLI smoke test
        run: python3 scripts/p01-credential-cli-smoke.py
      - name: Two-node Core Loop and signed exit rehearsal
        run: ./scripts/two-node-core-loop.sh
